<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkWork 文案提取</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo">LW</span>
      <div class="brand-text">
        <h1>LinkWork</h1>
        <span class="subtitle">链接文案提取</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="status" id="serviceStatus" title="本地服务状态">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">检查服务…</span>
        <span id="connState" class="conn">连接中</span>
      </div>
      <button id="settingsBtn" class="icon-btn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- 面板整体放进滚动容器：浏览器窗口矮时，可以上下滑动看完整内容 -->
  <main class="scroll" id="panelScroll">
    <section class="block" id="startBlock">
      <div class="row between">
        <span class="label" style="margin:0">本地服务</span>
        <label class="check-inline" title="打开侧边栏时，若服务没跑就通过「本机启动器」自动把它拉起来">
          <input type="checkbox" id="autoStartService" />
          <span>打开时自动启动</span>
        </label>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="startServiceBtn" class="btn">启动服务</button>
        <button id="installHostBtn" class="btn ghost" title="查看本机启动器（native host）的安装方式">本机启动器帮助</button>
      </div>
      <p class="hint" id="startHint"></p>
    </section>

    <section class="block">
      <label class="label" for="urlInput">分享链接</label>
      <textarea id="urlInput" class="input" rows="2"
        placeholder="粘贴视频 / 图文 / 网页链接，例如：&#10;https://v.douyin.com/xxxx/"></textarea>
      <div class="row">
        <button id="extractBtn" class="btn primary">提取文案</button>
        <button id="clearBtn" class="btn ghost">清空</button>
      </div>
      <div class="progress" id="progressWrap" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="hint" id="modeHint"></p>
    </section>

    <section class="block">
      <div class="result-head">
        <label class="label">提取结果</label>
        <div class="result-meta" id="resultMeta"></div>
      </div>
      <div class="result-wrap">
        <textarea id="resultBox" class="output" readonly
          placeholder="提取到的文案会显示在这里"></textarea>
      </div>
      <div class="row">
        <button id="copyBtn" class="btn primary">复制文案</button>
        <button id="copyRawBtn" class="btn" title="复制未整理的原始文本">复制原文</button>
        <button id="clearResultBtn" class="btn ghost">清空结果</button>
      </div>
    </section>

    <section class="block">
      <details id="logDetails" open>
        <summary>运行日志 <span id="logCount" class="badge">0</span></summary>
        <div class="log-actions">
          <button id="copyLogBtn" class="btn small">复制日志</button>
          <button id="clearLogBtn" class="btn small ghost">清空日志</button>
        </div>
        <pre id="logBox" class="log"></pre>
      </details>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
