<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkWork 设置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="settings">
    <header class="settings-header">
      <span class="logo">LW</span>
      <div>
        <h1>LinkWork 设置</h1>
        <p class="subtitle">文案校准 · 智谱 GLM-4.5-Flash</p>
      </div>
    </header>

    <section class="card">
      <h2>文案校准</h2>
      <p class="desc">
        提取到文案后，使用智谱 GLM-4.5-Flash 校准，只修正错别字、标点符号与分段，不改写文案内容。
      </p>

      <label class="field">
        <span class="field-label">智谱 API Key</span>
        <div class="key-row">
          <input id="apiKey" type="text" class="masked" name="linkwork-api-key"
            autocomplete="off" autocapitalize="off" spellcheck="false"
            data-lpignore="true" data-1p-ignore="true"
            placeholder="填写 bigmodel.cn 的 API Key" />
          <button id="toggleKey" class="btn ghost" type="button">显示</button>
        </div>
        <span class="field-hint">
          Key 只保存在本机浏览器扩展存储中，仅用于调用智谱接口。
          <a href="https://bigmodel.cn/usercenter/proj-mgmt/apikeys" target="_blank" rel="noreferrer">获取 API Key</a>
        </span>
      </label>

      <label class="field">
        <span class="field-label">免费模型</span>
        <select id="model">
          <option value="glm-4.5-flash">GLM-4.5-Flash</option>
          <option value="glm-4.7-flash">GLM-4.7-Flash</option>
        </select>
        <span class="field-hint">默认使用免费模型 GLM-4.5-Flash。</span>
      </label>

      <label class="check">
        <input type="checkbox" id="calibrate" />
        <span>启用文案校准</span>
      </label>

      <div class="actions">
        <button id="saveBtn" class="btn primary" type="button">保存</button>
        <button id="testBtn" class="btn" type="button">测试连接</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="card">
      <h2>媒体缓存</h2>
      <p class="desc">
        视频识别过程中下载的临时媒体与中间产物。任务结束会自动清理，这里可以查看占用并手动清理。
      </p>
      <div class="cache-row">
        <span class="cache-label">当前缓存</span>
        <span id="cacheSize" class="cache-size">—</span>
      </div>
      <div class="actions">
        <button id="clearCacheBtn" class="btn" type="button">清除缓存</button>
        <button id="openCacheBtn" class="btn ghost" type="button">打开缓存位置</button>
      </div>
      <label class="check cache-check">
        <input type="checkbox" id="autoClear" />
        <span>提取后自动清理本次下载的媒体</span>
      </label>
      <p id="cacheStatus" class="status" role="status"></p>
    </section>

    <section class="card">
      <h2>说明</h2>
      <ul class="notes">
        <li>需要填写智谱 API Key 才会进行文案校准；留空时直接输出原文。</li>
        <li>校准只修正错别字、标点与分段，不改写、不润色、不增删内容。</li>
        <li>修改后点击「保存」，回到侧边栏立即生效，无需重启服务。</li>
      </ul>
    </section>
  </main>

  <script src="options.js" type="module"></script>
</body>
</html>
